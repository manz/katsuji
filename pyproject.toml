[project]
name = "katsuji"
version = "0.1.0"
description = "Variable-width font tooling for a816 SNES projects: fonts, kerning, tiles, static text"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
dependencies = [
    "numpy>=1.26",
    "pillow>=10",
    "a816>=1.1.0a44",
]

[project.scripts]
katsuji = "katsuji.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.16",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/katsuji"]

[tool.ruff]
line-length = 120
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# ff4's dialog goldens, copied verbatim: their expected strings are long lines.
"tests/test_dialog_ff4.py" = ["E501"]

[tool.mypy]
strict = true
packages = ["katsuji", "tests"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["script", "script.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
