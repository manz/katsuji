# Push a `vX.Y.Z` tag matching pyproject's version: check, build, publish to PyPI.
# PyPI trusts this workflow (trusted publishing), so no token is stored here.
on:
  push:
    tags:
      - 'v*'
jobs:
  release:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv sync --locked
      - run: make check
      - name: Tag matches the version
        run: test "${GITHUB_REF_NAME#v}" = "$(uv version --short)"
      - run: uv build
      - uses: pypa/gh-action-pypi-publish@release/v1
